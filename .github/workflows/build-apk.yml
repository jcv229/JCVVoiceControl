name: Build APK

# Déclenchement : à chaque push/pull request sur master, et manuellement.
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # permet un lancement manuel depuis l'onglet Actions

# Un seul build à la fois.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK (release)
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Récupérer le code source
      # ------------------------------------------------------------------
      - name: Récupérer le code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Installer Flutter (version épinglée)
      # ------------------------------------------------------------------
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ------------------------------------------------------------------
      # 3. Installer Java 17 (requis par AGP 8.x / compileSdk 34+)
      # ------------------------------------------------------------------
      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ------------------------------------------------------------------
      # 4. AUTO-RÉPARATION : télécharger le wrapper Gradle s'il est absent
      #    (gradlew + gradle-wrapper.jar sont indispensables à flutter build)
      # ------------------------------------------------------------------
      - name: Télécharger le wrapper Gradle (si absent)
        run: |
          cd app/android
          if [ ! -f gradlew ]; then
            echo "→ gradlew absent, téléchargement…"
            curl -sL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew"
            chmod +x gradlew
          else
            echo "✔ gradlew présent"
          fi
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "→ gradle-wrapper.jar absent, téléchargement…"
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          else
            echo "✔ gradle-wrapper.jar présent"
          fi
        shell: bash

      # ------------------------------------------------------------------
      # 5. Télécharger le modèle Vosk français (~40 Mo) — NON présent dans le repo
      # ------------------------------------------------------------------
      - name: Télécharger le modèle Vosk français
        run: |
          cd app/android/app/src/main/assets/model-fr
          curl -sL -o model.zip \
            "https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip"
          unzip -q model.zip
          rm model.zip
          cp -r vosk-model-small-fr-0.22/* .
          rm -rf vosk-model-small-fr-0.22
          uuidgen > uuid || cat /proc/sys/kernel/random/uuid > uuid
          echo "✔ Modèle Vosk français installé"
        shell: bash

      # ------------------------------------------------------------------
      # 6. Récupérer les dépendances Dart
      # ------------------------------------------------------------------
      - name: Récupérer les dépendances
        working-directory: app
        run: flutter pub get

      # ------------------------------------------------------------------
      # 7. Tests unitaires
      # ------------------------------------------------------------------
      - name: Tests unitaires
        working-directory: app
        run: flutter test

      # ------------------------------------------------------------------
      # 8. Compiler l'APK release
      # ------------------------------------------------------------------
      - name: Compiler l'APK
        working-directory: app
        run: flutter build apk --release

      # ------------------------------------------------------------------
      # 9. Publier l'APK en artefact (téléchargeable)
      # ------------------------------------------------------------------
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: JCVVoiceControl-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ------------------------------------------------------------------
      # 10. (Optionnel) Créer une release GitHub si un tag v* est poussé
      # ------------------------------------------------------------------
      - name: Créer une release GitHub (si tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
